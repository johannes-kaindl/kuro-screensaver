# Release pipeline (GitHub Actions).
#
# Codeberg is the primary repo; a Codeberg → GitHub push mirror forwards commits +
# tags automatically, so pushing a tag triggers this workflow on the mirror.
#
# macOS deliverable = the standalone native Metal app (KuroMetalApp). It is notarized
# + uploaded to the release LOCALLY (CI has no Developer ID cert) via
# scripts/package-native-app.sh. CI therefore only *compile-checks* the macOS app and
# ships the Windows .scr + a one-click Inno Setup installer — both built on a
# windows-latest runner (the C++/Win32 host is MSVC-only, no Linux cross-build). The
# legacy .saver paths (WebView .saver, native live .saver, pre-rendered video .savers)
# were deprecated 2026-06-03 — the native app replaces them.
#
# SETUP (one-time, user side):
#   1. Codeberg → Settings → Push Mirror to the GitHub repo (incl. tags).
#   2. GitHub repo → Settings → Secrets → CODEBERG_TOKEN (Codeberg token, repo write).
#   3. Tag a release on Codeberg: `git tag v0.5.0 && git push origin v0.5.0`.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Typecheck web engine
        run: |
          npm ci
          npm run typecheck
      - name: Run native logic tests
        run: bash scripts/run-native-tests.sh
      - name: Build native Metal app (compile check)
        run: |
          # macOS deliverable is the standalone fullscreen Metal app. CI has no
          # Developer ID cert, so this is an ad-hoc build/smoke check only — the
          # NOTARIZED release build is produced + uploaded locally via
          # scripts/package-native-app.sh. swiftc, no Xcode.
          bash scripts/build-native-app.sh
          mkdir -p dist-native
          ditto -c -k --keepParent native/macos/build/KuroMetalApp.app dist-native/KuroMetalApp-ci-unsigned.zip
      - name: Headless render smoke test
        # Renders one frame through the real engine (runtime shader compile + draw)
        # and asserts a valid PNG — catches runtime shader/pipeline regressions the
        # logic tests can't see. GPU-aware: the script self-skips (exit 0) if the
        # runner has no Metal device, so this is safe to run blocking.
        run: bash scripts/smoke-test-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-ci
          if-no-files-found: ignore
          path: dist-native/KuroMetalApp-ci-unsigned.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Typecheck + web tests
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build .scr (C++ micro-host, MSVC)
        shell: bash
        run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist-native/KuroScreensaver-windows.zip

  windows-installer:
    runs-on: windows-latest
    # Optional convenience deliverable: the one-click Inno Setup installer. Both
    # Windows jobs run on windows-latest — the C++/Win32 host is MSVC-only, no Linux
    # cross-build. continue-on-error keeps a flaky Inno step from blocking the
    # release — the .scr from the `windows` job is the required artifact.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
      - name: Compile installer (same script as the installer CI job)
        shell: bash
        # The script builds the publish folder AND compiles the .iss, so nothing
        # here can diverge from what windows-host.yml's `installer` job proves on
        # every commit. Spelling these steps out again is exactly how v0.7.0
        # shipped a framework-dependent installer: the duplicated build command
        # drifted from the script's. KURO_REQUIRE_ISCC makes a missing compiler
        # fatal — without it the script exits 0 with the publish folder only, and
        # a release would silently carry no installer.
        env:
          KURO_REQUIRE_ISCC: "1"
        run: |
          npm ci
          bash scripts/package-windows-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-installer
          if-no-files-found: ignore
          path: dist-native/KuroScreensaver-Setup-*.exe

  publish:
    needs: [macos, windows, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach the Windows .scr to the Codeberg release
        env:
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          TAG: ${{ github.ref_name }}
          API: https://codeberg.org/api/v1/repos/jkaindl/kuro-screensaver
        run: |
          set -euo pipefail

          # Create the release for this tag (ignore 409 = already exists, e.g. when
          # it was pre-created locally with full notes + the notarized app attached).
          curl -sS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Kuro Screensaver $TAG\"}" \
            -o /dev/null -w "create release HTTP %{http_code}\n" || true

          rel_id=$(curl -sS "$API/releases/tags/$TAG" -H "Authorization: token $TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          test -n "$rel_id"

          # Upload a file with retry (transient Codeberg 5xx). Delete any same-name
          # asset first so re-runs are idempotent. $2=1 → required (fail if missing),
          # $2=0 → optional (warn + skip if missing).
          attach() {
            local f="$1" required="$2" name
            if [ ! -f "$f" ]; then
              if [ "$required" = 1 ]; then echo "::error::missing required asset $f"; exit 1; fi
              echo "::warning::optional asset not found, skipping: $f"; return 0
            fi
            name=$(basename "$f")
            for attempt in 1 2 3 4; do
              existing=$(curl -sS "$API/releases/$rel_id/assets" -H "Authorization: token $TOKEN" \
                | python3 -c "import sys,json; print(next((a['id'] for a in json.load(sys.stdin) if a['name']=='$name'), ''))")
              [ -n "$existing" ] && curl -sS -X DELETE "$API/releases/$rel_id/assets/$existing" -H "Authorization: token $TOKEN" -o /dev/null
              code=$(curl -sS -X POST "$API/releases/$rel_id/assets?name=$name" \
                -H "Authorization: token $TOKEN" -F "attachment=@$f" -o /dev/null -w "%{http_code}")
              echo "upload $name HTTP $code (attempt $attempt)"
              case "$code" in 2*) return 0;; esac
              [ "$attempt" = 4 ] && { echo "::error::upload $name failed after 4 attempts (last HTTP $code)"; exit 1; }
              sleep $((attempt * 10))
            done
          }

          # Required: the .scr ZIP. Optional: the one-click installer (.exe), which
          # the windows-installer job uploads only when the Inno compile succeeds.
          attach artifacts/dist-windows/KuroScreensaver-windows.zip 1
          shopt -s nullglob
          for inst in artifacts/dist-windows-installer/KuroScreensaver-Setup-*.exe; do
            attach "$inst" 0
          done
          shopt -u nullglob
