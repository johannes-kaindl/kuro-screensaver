<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kuro Screensaver — Settings</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 16px 20px 20px;
        background: #050807; color: #9dffb0;
        font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px;
        user-select: none;
      }
      [hidden] { display: none !important; }
      h1 { font-size: 14px; letter-spacing: 2px; margin: 0 0 12px; color: #d4ffdd; }
      .tabs { display: flex; gap: 2px; margin-bottom: 12px; border-bottom: 1px solid #1e3a28; }
      button.tab {
        border: 1px solid #1e3a28; border-bottom: none; padding: 6px 18px;
        opacity: 0.6; margin-bottom: -1px;
      }
      button.tab.active {
        background: rgba(10, 18, 13, 0.45); border-color: #2c5a3c;
        border-bottom: 1px solid #050807; color: #d4ffdd; opacity: 1;
      }
      .wp-head {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        border: 1px solid #1e3a28; background: rgba(10, 18, 13, 0.45);
        padding: 8px 12px; margin-bottom: 10px;
      }
      .status-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .status { opacity: 0.7; }
      .status.on { color: #d4ffdd; opacity: 1; }
      /* Quieter than Save: pausing is reversible and not what you came here for. */
      button.pause {
        background: transparent; border: 1px solid #2a5a3c; color: #a8d8b8;
        padding: 3px 10px; font: inherit; font-size: 11px; cursor: pointer;
      }
      button.pause:hover { border-color: #39ff7a; color: #d4ffdd; }
      .reason { font-size: 11px; opacity: 0.7; }
      .toggle.disabled { cursor: default; opacity: 0.5; }
      .look-row { margin-bottom: 12px; }
      .look-row > label { width: 96px; }
      .section {
        border: 1px solid #1e3a28; background: rgba(10, 18, 13, 0.45);
        padding: 10px 12px 12px; margin-bottom: 10px;
      }
      .section h2 {
        font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
        margin: 0 0 10px; color: #d4ffdd;
      }
      .grid {
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 7px 18px; align-items: center;
      }
      .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .row > label:first-child { flex: none; width: 96px; opacity: 0.8; }
      select {
        flex: 1; min-width: 0; background: #0a120d; color: #9dffb0;
        border: 1px solid #1e3a28; padding: 4px 6px; font: inherit;
      }
      select:disabled { opacity: 0.4; }
      input[type="range"] { flex: 1; min-width: 0; accent-color: #3ddc84; margin: 0; }
      .val { flex: none; width: 48px; text-align: right; opacity: 0.9; }
      .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 0; }
      input[type="checkbox"], input[type="radio"] { accent-color: #3ddc84; margin: 0; }
      .radios { gap: 16px; }
      .radios > label:first-child { flex: none; width: 96px; opacity: 0.8; }
      .mon-card {
        border: 1px solid #1e3a28; background: rgba(5, 10, 7, 0.5);
        padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
        align-self: start;
      }
      .mon-card .row > label:first-child { width: 52px; }
      .mon-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .mon-name { color: #d4ffdd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .badge {
        flex: none; border: 1px solid #2c5a3c; color: #8fd9a0;
        font-size: 10px; letter-spacing: 1px; padding: 1px 6px;
      }
      .hint { font-size: 11px; opacity: 0.7; margin-top: 8px; }
      .error {
        color: #ff7b72; border: 1px solid #7a2424; background: rgba(122, 36, 36, 0.12);
        padding: 6px 10px; margin-bottom: 10px;
      }
      .buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
      button {
        background: #0a120d; color: #9dffb0; border: 1px solid #2c5a3c;
        padding: 6px 22px; font: inherit; letter-spacing: 1px; cursor: pointer;
      }
      button:hover { background: #12241a; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
