# xcodegen manifest — generates KuroScreensaver.xcodeproj reproducibly.
#   brew install xcodegen && xcodegen generate
#
# Two targets:
#   KuroScreensaverApp  — the shipped product: a fullscreen .app hosting the
#                         web engine in a WKWebView (WebGL composites in a
#                         normal app process). Build:
#                           xcodebuild -scheme KuroScreensaverApp -configuration Release
#   KuroScreensaver     — the .saver bundle (kept for reference / a possible
#                         future native rewrite). NOT shipped: WebGL does not
#                         composite in the sandboxed legacyScreenSaver process.
#
# The web build is bundled into KuroScreensaver/web/ by scripts/bundle-web.sh
# before building (gitignored; referenced as a folder resource by both targets).

name: KuroScreensaver

options:
  bundleIdPrefix: com.kuro
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "11.0"

targets:

  KuroScreensaverApp:
    type: application
    platform: macOS
    sources:
      - path: KuroScreensaverApp
        excludes:
          - "Info.plist"
      - path: KuroScreensaver/WebSchemeHandler.swift   # shared with the .saver
      - path: KuroScreensaver/web
        type: folder
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: KuroScreensaver
        PRODUCT_BUNDLE_IDENTIFIER: com.kuro.screensaver.app
        INFOPLIST_FILE: KuroScreensaverApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "11.0"
        # Ad-hoc signed (free, no Apple account) so it runs on Apple Silicon.
        # package-macos.sh re-signs with proper resource sealing afterward.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - sdk: WebKit.framework
      - sdk: Cocoa.framework

  KuroScreensaver:
    type: bundle
    platform: macOS
    sources:
      - path: KuroScreensaver
        excludes:
          - "web/**"
          - "Info.plist"
      - path: KuroScreensaver/web
        type: folder
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: KuroScreensaver
        PRODUCT_BUNDLE_IDENTIFIER: com.kuro.screensaver
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: KuroScreensaver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "11.0"
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: WebKit.framework
      - sdk: Cocoa.framework

  # Video .saver — the SHIPPING macOS screensaver. Plays a pre-rendered loop of
  # the engine via AVPlayer, which (unlike WebGL) composites fine in the
  # screensaver process. scripts/build-video-savers.sh builds this once per
  # preset (unique class name) and copies that preset's loop.mov into the bundle
  # AFTER the build — so loop.mov is intentionally NOT a target resource here
  # (a missing one would fail CpResource at build time).
  KuroVideoSaver:
    type: bundle
    platform: macOS
    sources:
      - path: KuroVideoSaver
        excludes:
          - "Info.plist"
          - "loop.mov"
    settings:
      base:
        PRODUCT_NAME: KuroVideoSaver
        PRODUCT_BUNDLE_IDENTIFIER: com.kuro.screensaver.video
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: KuroVideoSaver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "11.0"
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: AVFoundation.framework
      - sdk: Cocoa.framework

  # Native Metal .saver — the live, procedurally-rendered screensaver (no
  # WebView, no video). Renders terrain + the CRT look directly in Metal, which
  # (unlike WebGL) is expected to composite in the legacyScreenSaver process —
  # the gate to verify on-device. Shaders compile at runtime (no .metallib).
  # Single configurable bundle with a unique principal class (no class
  # collision). Xcode-free local build: scripts/build-native-saver.sh.
  KuroNativeSaver:
    type: bundle
    platform: macOS
    sources:
      - path: KuroNativeSaver/Core
      - path: KuroNativeSaver/Host
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: KuroNativeSaver
        PRODUCT_BUNDLE_IDENTIFIER: com.kuro.screensaver.native
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: KuroNativeSaver/Host/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "11.0"
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: QuartzCore.framework
      - sdk: Cocoa.framework

# Explicit shared scheme so `xcodebuild -scheme KuroScreensaverApp` is
# deterministic (don't rely on xcodebuild auto-creating schemes).
schemes:
  KuroScreensaverApp:
    build:
      targets:
        KuroScreensaverApp: all
    run:
      config: Release
    archive:
      config: Release
  KuroVideoSaver:
    build:
      targets:
        KuroVideoSaver: all
    run:
      config: Release
    archive:
      config: Release
  KuroNativeSaver:
    build:
      targets:
        KuroNativeSaver: all
    run:
      config: Release
    archive:
      config: Release
